name: rasmai-beta

# A second copy of the whole stack for trying a branch on its own port, beside the live one.
# Nothing is shared with it: its own images, containers, network, database and caches, and it
# reads only .env.beta, never .env. Start it with
#   docker compose -f docker-compose.beta.yml --env-file .env.beta up -d --build
# and stop it with
#   docker compose -f docker-compose.beta.yml --env-file .env.beta down
services:
  bot:
    # a tag of its own, so building the beta never replaces the image the live bot runs from
    image: rasmai-beta:local
    build:
      context: .
      target: bot
      args:
        BOT_UID: ${BOT_UID:-1000}
        BOT_GID: ${BOT_GID:-1000}
        WITH_LAYA: ${WITH_LAYA:-0}
    container_name: rasmai-beta
    env_file: .env.beta
    environment:
      MAIMAI_WEBSERVER_HOST: 0.0.0.0
      MAIMAI_DATABASE_PATH: /app/data/maimai.sqlite3
      MAIMAI_TUNNEL_ORIGIN: http://web:3000
      # a second bot application's token, not the live one: two sessions on one token both get every
      # command, and the live bot's answers would be raced by the beta's
      DISCORD_TOKEN: ${DISCORD_TOKEN:?set DISCORD_TOKEN in .env.beta to a separate beta bot's token}
      RASMAI_INTERNAL_SECRET: ${RASMAI_INTERNAL_SECRET:?set RASMAI_INTERNAL_SECRET in .env.beta (openssl rand -hex 32)}
    volumes:
      - ./beta/data:/app/data
      - ./beta/otoge_cache:/app/otoge_cache
      - ./beta/models:/app/models
      - ./beta/simai_cache:/app/simai_cache
      - ./beta/debug:/app/debug
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    shm_size: "1gb"
    # a trial does not come back by itself after a reboot
    restart: "no"
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  web:
    image: rasmai-beta-web:local
    build:
      context: .
      target: web
    container_name: rasmai-beta-web
    env_file: .env.beta
    environment:
      MAIMAI_INTERNAL_URL: http://bot:8765
      RASMAI_INTERNAL_SECRET: ${RASMAI_INTERNAL_SECRET:?set RASMAI_INTERNAL_SECRET in .env.beta (openssl rand -hex 32)}
    ports:
      # loopback only unless BETA_BIND says otherwise. Google only accepts a plain-http redirect for localhost,
      # so reaching it from another machine needs an https address in front (a tunnel) and MAIMAI_PUBLIC_URL set to it
      - "${BETA_BIND:-127.0.0.1}:${BETA_PORT:-8766}:3000"
    depends_on:
      - bot
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
