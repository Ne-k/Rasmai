<!-- @page -->  <!-- shared page shell: header, body slot, footer -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8" /><style>{css}</style></head>
<body class="{body_class}">
<div class="image">
  <header>
    <div class="emblem">{avatar}</div>
    <div class="who"><h1>{eyebrow}</h1><div class="nametag">{name}</div></div>
    <div class="headline"><div class="value">{headline_value}</div><div class="caption">{headline_caption}</div></div>
  </header>
  {body}
  <footer><span>{foot_left}</span><span>{foot_right}</span></footer>
</div>
</body>
</html>

<!-- @avatar -->
<img src="data:image/png;base64,{data}" class="avatar" />

<!-- @avatar-none -->
<div class="avatar no-cover"></div>
