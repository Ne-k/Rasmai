<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<script>try{if(localStorage.getItem("rasmai-theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
<title>Rasmai · offline</title>
<style>
  :root { --paper: #fbf6ec; --ink: #1d1a2f; --ink-2: #4a4660; --pink: #ff3d8f; --line: #e2d8c4; --edge: #1d1a2f; }
  :root[data-theme="dark"] { color-scheme: dark; --paper: #14121c; --ink: #f4f0e6; --ink-2: #c6c0d4; --pink: #ff5c9f; --line: #322d42; --edge: #5a5470; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
         background: var(--paper); color: var(--ink); font-family: "Zen Kaku Gothic New", "Yu Gothic UI", "Segoe UI", sans-serif; line-height: 1.5; }
  main { max-width: 420px; text-align: center; }
  svg { display: block; margin: 0 auto 18px; }
  h1 { font-size: 30px; line-height: 1.1; margin: 0 0 10px; font-weight: 900; }
  h1 em { font-style: normal; color: var(--pink); }
  p { color: var(--ink-2); margin: 0 0 22px; }
  a { display: inline-block; padding: 12px 22px; border-radius: 999px; border: 2px solid var(--edge); background: var(--ink); color: var(--paper); font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<main>
  <svg width="96" height="96" viewBox="0 0 64 64" role="img" aria-label="maimai button ring">
    <circle cx="32" cy="32" r="24" fill="none" stroke="var(--edge)" stroke-width="5"/>
    <circle cx="32" cy="32" r="24" fill="none" stroke="#fff" stroke-width="3"/>
    <circle cx="32" cy="32" r="12" fill="var(--ink)"/>
    <g fill="var(--paper)" stroke="var(--edge)" stroke-width="1.5">
      <circle cx="41.2" cy="9.8" r="5"/><circle cx="54.2" cy="22.8" r="5"/><circle cx="54.2" cy="41.2" r="5"/><circle cx="41.2" cy="54.2" r="5"/>
      <circle cx="22.8" cy="54.2" r="5"/><circle cx="9.8" cy="41.2" r="5"/><circle cx="9.8" cy="22.8" r="5"/><circle cx="22.8" cy="9.8" r="5"/>
    </g>
  </svg>
  <h1>No <em>connection</em>.</h1>
  <p>Your scores live on the server, so the dashboard needs the network. Nothing was lost; try again when you are back online.</p>
  <a href="/me/">Try again</a>
</main>
</body>
</html>
