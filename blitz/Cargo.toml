[package]
name = "blitz"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyrender = "0.15"
anyrender_vello_cpu = { version = "0.19.0", features = ["filters"] }
base64 = "0.23.1"
blitz-dom = "=0.3.0-beta.6"
blitz-html = "=0.3.0-beta.6"
blitz-paint = "=0.3.0-beta.6"
blitz-traits = "=0.3.0-beta.6"
# open fontconfig at run time rather than link it, so the Docker image cross-compiles with no target libraries; fontique's
# own feature, which switches both it and the bindings it uses
fontique = { version = "0.13.0", default-features = false, features = ["fontconfig-dlopen"] }
percent-encoding = "2.3.2"
png = "0.18.1"
stylo_static_prefs = "=0.24.0"

# Patched copies in vendor/ of the crates the images need fixed: Blitz's paint and DOM crates, Taffy and Stylo from Blitz
# 0.3.0-beta.6's dependency tree, and the Vello CPU renderer. THIRD_PARTY_NOTICES.md lists each version and change
[patch.crates-io]
blitz-paint = { path = "vendor/blitz-paint" }
blitz-dom = { path = "vendor/blitz-dom" }
anyrender_vello_cpu = { path = "vendor/anyrender_vello_cpu" }
taffy = { path = "vendor/taffy" }
stylo = { path = "vendor/stylo" }
vello_common = { path = "vendor/vello_common" }
vello_cpu = { path = "vendor/vello_cpu" }
